<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/img/icono.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/icono-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="contenedor">
      <a class="marca" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/icono.svg' | relative_url }}" alt="" width="28" height="28">{{ site.title }}</a>
      <nav>
        <a href="{{ '/tramites/costa-rica/' | relative_url }}">Trámites</a>
        <a href="{{ '/alertas/' | relative_url }}">Alertas</a>
        <a href="{{ '/buses/' | relative_url }}">Buses</a>
        <a href="{{ '/buscar.html' | relative_url }}">Buscar</a>
        <a href="https://github.com/axelfj/ventanilla-abierta/issues/new/choose">Ayudar</a>
      </nav>
    </div>
  </header>
  <main class="contenedor">
    {{ content }}
  </main>
  <footer class="contenedor pie">
    <p>Información general, no asesoría legal. Contenido <a href="{{ '/LICENSE-CONTENIDO.html' | relative_url }}">CC BY-SA 4.0</a> · Código <a href="https://github.com/axelfj/ventanilla-abierta">MIT en GitHub</a>.</p>
  </footer>
</body>
</html>
