# Dependabot abre un PR cuando sale una versión nueva de las acciones que usan los workflows,
# porque están fijas a un commit exacto y no se actualizan solas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Un solo PR al mes con todas las acciones, para que no se acumulen si nadie los revisa.
    groups:
      acciones:
        patterns: ["*"]
    open-pull-requests-limit: 2
