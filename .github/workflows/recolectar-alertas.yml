name: Recolectar alertas

# Cada hora junta las alertas de las fuentes oficiales y las guarda en la rama `datos`
# (ver scripts/recolectores/publicar-datos.sh). La página /alertas/ las lee de ahí. GitHub puede atrasar los workflows programados: esto no es un sistema
# de emergencias.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/recolectores/**"
      - ".github/workflows/recolectar-alertas.yml"

# Por defecto, solo lectura. Solo el trabajo "publicar" puede escribir, y solo en main.
permissions:
  contents: read

# Mismo grupo que "Recolectar tarifas de bus", porque las dos escriben en la rama datos.
concurrency:
  group: rama-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Las acciones van fijas a un commit exacto (el comentario dice la versión), para que nadie
      # pueda cambiar lo que corre aquí moviendo una etiqueta. Dependabot propone las actualizaciones.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pruebas con muestras guardadas
        run: python3 -m unittest discover scripts/recolectores/pruebas -v

      # Si una fuente falla, se conservan sus alertas de la corrida anterior.
      - name: Traer las alertas anteriores
        run: |
          if git fetch --depth 1 origin datos 2>/dev/null; then
            git show origin/datos:alertas/activas.json > anterior.json || true
          fi

      - name: Recolectar
        run: python3 scripts/recolectores/alertas.py salida/alertas --anterior anterior.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alertas
          path: salida/alertas
          retention-days: 1
          if-no-files-found: error

  # En los pull requests solo se prueba; publicar es solo desde main.
  publicar:
    needs: recolectar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alertas
          path: salida/alertas
      - name: Publicar en la rama datos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/recolectores/publicar-datos.sh salida/alertas alertas
