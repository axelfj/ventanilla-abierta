name: Validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guias:
    name: Guías y categorías
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validar.py

  sitio:
    name: El sitio compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La misma acción que usa GitHub Pages para compilar, así que si pasa aquí, pasa al publicar.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
