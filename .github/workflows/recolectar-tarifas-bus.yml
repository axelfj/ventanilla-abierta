name: Recolectar tarifas de bus

# Una vez al día baja el pliego tarifario de autobús de la ARESEP (dato abierto oficial)
# y lo guarda en la rama `datos`. La página /buses/ lo lee de ahí.
on:
  schedule:
    - cron: "40 11 * * *" # 5:40 a. m. en Costa Rica
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/recolectores/**"
      - ".github/workflows/recolectar-tarifas-bus.yml"

# Por defecto, solo lectura. Solo el trabajo "publicar" puede escribir, y solo en main.
permissions:
  contents: read

# Mismo grupo que "Recolectar alertas", porque las dos escriben en la rama datos.
concurrency:
  group: rama-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Las acciones van fijas a un commit exacto (el comentario dice la versión), para que nadie
      # pueda cambiar lo que corre aquí moviendo una etiqueta. Dependabot propone las actualizaciones.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pruebas con muestras guardadas
        run: python3 -m unittest discover scripts/recolectores/pruebas -v

      - name: Recolectar
        run: python3 scripts/recolectores/tarifas_bus.py salida/buses

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buses
          path: salida/buses
          retention-days: 1
          if-no-files-found: error

  # En los pull requests solo se prueba; publicar es solo desde main.
  publicar:
    needs: recolectar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: buses
          path: salida/buses
      - name: Publicar en la rama datos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/recolectores/publicar-datos.sh salida/buses buses
