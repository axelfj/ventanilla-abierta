title: Ventanilla Abierta
description: Guías claras y gratuitas para hacer trámites en Costa Rica. Sin fila.
lang: es-CR
markdown: kramdown
exclude:
  - plantillas/
  - .github/
  - scripts/
plugins:
  - jekyll-sitemap
# Lo que no es para el público queda fuera del sitemap (sigue publicado por si alguien lo enlaza).
defaults:
  - scope: { path: README.md }
    values: { sitemap: false }
  - scope: { path: CONTRIBUTING.md }
    values: { sitemap: false }
  - scope: { path: SECURITY.md }
    values: { sitemap: false }
  - scope: { path: docs }
    values: { sitemap: false }
# Códigos para que Google y Bing confirmen que el sitio es nuestro (ver docs/indexacion.md).
# Se pega solo el código del atributo content="...", no la etiqueta entera.
google_site_verification:
bing_site_verification:
