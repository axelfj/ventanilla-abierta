# Palabras y frases como las escribe la gente, y qué buscar cuando aparecen.
# El buscador ignora tildes y mayúsculas. `frase` se busca dentro de lo que la persona escribió;
# `buscar` son palabras o frases que aparecen en el título o el texto de la guía correcta.
# Si agregás una línea, sumá también una búsqueda de prueba en scripts/busquedas-de-prueba.json.

