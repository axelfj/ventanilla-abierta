# Carreras de las universidades públicas y su nota de corte oficial (última nota que entró).
# Solo fuentes oficiales de cada universidad. `nota: null` = la universidad no publica nota de corte para esa carrera.
# Las notas se copian tal cual del documento oficial; solo se cambia la coma decimal por punto.
universidades:
  - id: ucr
    nombre: Universidad de Costa Rica
    siglas: UCR
    admision: "Prueba de Aptitud Académica (PAA) promediada con la nota de colegio; los cupos de cada carrera se llenan de la nota más alta hacia abajo. El corte es la nota del último admitido, en puntos con dos decimales. Desde 2021 no hay nota mínima para concursar."
    fuente_carreras: "https://ori.ucr.ac.cr/sites/default/files/2025-11/2025-cortes_ordinaria.pdf"
    fuente_notas: "https://ori.ucr.ac.cr/sites/default/files/2025-11/2025-cortes_ordinaria.pdf"
    anio_notas: "Ingreso 2025"
    verificado: 2026-10-18
    nota: "Cortes de admisión ordinaria, primer ingreso 2025 (ORI-UCR), el documento oficial más reciente que se pudo abrir. Los cortes de Ingreso 2026 se publicaron en la consulta https://consultasic.ucr.ac.cr/cortespi/, que hoy está cerrada; la UCR solo publicó en su sitio de noticias los 10 más altos. Solo aparecen las carreras con corte en admisión ordinaria; no incluye admisión diferida (carreras con requisito especial)."
